name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  validate-hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run tests
        run: python -m pytest -q tests/energy_consistency
      - name: Compile Python sources
        run: python -m compileall -q custom_components/energy_consistency
      - name: Validate JSON
        shell: python
        run: |
          import json
          from pathlib import Path

          for path in Path("custom_components/energy_consistency").rglob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
      - name: Check badge JavaScript syntax
        run: node --check custom_components/energy_consistency/www/energy-consistency-badge.js
