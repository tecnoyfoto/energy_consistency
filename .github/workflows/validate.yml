name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  validate-hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest ruff
      - name: Run tests
        run: python -m pytest -q tests/energy_consistency
      - name: Compile Python sources
        run: python -m compileall -q custom_components/energy_consistency
      - name: Validate JSON
        shell: python
        run: |
          import json
          from pathlib import Path

          for path in Path("custom_components/energy_consistency").rglob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
      - name: Check badge JavaScript syntax
        run: node --check custom_components/energy_consistency/www/energy-consistency-badge.js
      - name: Lint Python
        run: python -m ruff check custom_components tests scripts
      - name: Test badge diagnosis
        run: node --test tests/frontend/test_badge.cjs
      - name: Validate public release metadata
        run: python scripts/validate_release.py
      - name: Build public-only installable archive
        run: python scripts/build_release.py
